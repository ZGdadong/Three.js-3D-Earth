<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="docTitle">Three.js 真实地球 · 无月球与太阳</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    /* 加载提示层 */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(ellipse at center, #06121f 0%, #000 70%);
      color: #9fc3e8;
      z-index: 20;
      transition: opacity 0.6s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loader .ring {
      width: 54px;
      height: 54px;
      border: 3px solid rgba(120, 180, 255, 0.25);
      border-top-color: #6db4ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    #loader .label {
      font-size: 15px;
      letter-spacing: 1px;
    }
    #loader .label b {
      color: #cfe6ff;
    }

    /* HUD 说明 */
    #hud {
      position: fixed;
      left: 18px;
      bottom: 16px;
      color: rgba(210, 232, 255, 0.82);
      font-size: 13px;
      line-height: 1.7;
      background: rgba(6, 16, 30, 0.45);
      border: 1px solid rgba(120, 180, 255, 0.18);
      border-radius: 10px;
      padding: 12px 16px;
      backdrop-filter: blur(6px);
      z-index: 10;
      max-width: 300px;
    }
    #hud h1 {
      font-size: 15px;
      color: #bfe0ff;
      margin-bottom: 6px;
      font-weight: 600;
    }
    #hud .k {
      color: #6db4ff;
    }

    /* 信息指示 */
    #status {
      position: fixed;
      left: 18px;
      top: 16px;
      color: rgba(210, 232, 255, 0.9);
      font-size: 13px;
      background: rgba(6, 16, 30, 0.45);
      border: 1px solid rgba(120, 180, 255, 0.18);
      border-radius: 10px;
      padding: 8px 14px;
      backdrop-filter: blur(6px);
      z-index: 10;
    }
    #status b {
      color: #cfe6ff;
    }
    #status .dim {
      color: #7ba6d6;
    }

    /* 语言切换（右上角） */
    #langBar {
      position: fixed;
      right: 18px;
      top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(210, 232, 255, 0.9);
      font-size: 13px;
      background: rgba(6, 16, 30, 0.45);
      border: 1px solid rgba(120, 180, 255, 0.18);
      border-radius: 10px;
      padding: 8px 12px;
      backdrop-filter: blur(6px);
      z-index: 11;
    }
    #langBar .navicon {
      font-size: 15px;
      color: #9fc3e8;
    }
    #langBar select {
      background: rgba(20, 40, 64, 0.9);
      color: #dff1ff;
      border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    #langBar select option {
      background: #0a1728;
      color: #dff1ff;
    }
    #langBar button {
      background: none;
      border: 1px solid rgba(120, 180, 255, 0.3);
      color: #9fc3e8;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 13px;
      cursor: pointer;
      line-height: 1.2;
    }
    #langBar button:hover {
      background: rgba(63, 140, 200, 0.35);
      color: #dff1ff;
    }

    canvas {
      display: block;
    }

    /* 保存/操作提示 toast */
    #toast {
      position: fixed;
      left: 50%;
      top: 20px;
      transform: translateX(-50%) translateY(-12px);
      background: rgba(6, 16, 30, 0.92);
      color: #dff1ff;
      border: 1px solid rgba(120, 180, 255, 0.35);
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 30;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 让 lil-gui 面板可滚动，保证所有参数（含保存按钮）都能看到 */
    .lil-gui.root,
    .lil-gui {
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      overflow-x: hidden;
    }
    .lil-gui::-webkit-scrollbar {
      width: 8px;
    }
    .lil-gui::-webkit-scrollbar-thumb {
      background: rgba(120, 180, 255, 0.3);
      border-radius: 4px;
    }

    /* 飞线设置表格面板 */
    #flightPanel {
      position: fixed;
      left: 18px;
      top: 88px;
      width: 440px;
      max-height: calc(100vh - 210px);
      display: flex;
      flex-direction: column;
      background: rgba(6, 16, 30, 0.72);
      border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 12px;
      color: #dff1ff;
      font-size: 13px;
      z-index: 12;
      backdrop-filter: blur(8px);
      overflow: hidden;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    #flightPanel.collapsed .body,
    #flightPanel.collapsed .foot {
      display: none;
    }
    #flightPanel header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-bottom: 1px solid rgba(120, 180, 255, 0.2);
      font-weight: 600;
      color: #bfe0ff;
    }
    #flightPanel header button {
      background: none;
      border: none;
      color: #8fb8e8;
      cursor: pointer;
      font-size: 13px;
    }
    #flightPanel .body {
      overflow-y: auto;
      padding: 8px 10px;
    }
    #flightPanel table {
      width: 100%;
      border-collapse: collapse;
    }
    #flightPanel th {
      text-align: left;
      color: #7ba6d6;
      font-weight: 600;
      padding: 3px 4px;
      font-size: 12px;
    }
    #flightPanel td {
      padding: 3px 4px;
    }
    #flightPanel select {
      width: 100%;
      background: rgba(20, 40, 64, 0.9);
      color: #dff1ff;
      border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 13px;
      outline: none;
    }
    #flightPanel .btns {
      white-space: nowrap;
    }
    #flightPanel .btns button {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid rgba(120, 180, 255, 0.3);
      background: rgba(40, 70, 110, 0.6);
      color: #dff1ff;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      margin-right: 3px;
    }
    #flightPanel .btns button.add:hover {
      background: #2f6f9f;
    }
    #flightPanel .btns button.del:hover {
      background: #a04040;
    }
    #flightPanel .addgroup {
      width: 100%;
      margin-top: 8px;
      padding: 7px 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: rgba(63, 120, 180, 0.25);
      color: #cfe6ff;
      font-size: 13px;
    }
    #flightPanel .addgroup:hover {
      background: rgba(63, 140, 200, 0.4);
    }
    #flightPanel .foot {
      padding: 8px 12px;
      border-top: 1px solid rgba(120, 180, 255, 0.2);
      color: #7ba6d6;
      font-size: 11px;
      line-height: 1.6;
    }

    /* 视图切换（地球 / 中国地图） */
    #viewToggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: rgba(6, 16, 30, 0.6);
      color: #dff1ff;
      border: 1px solid rgba(120, 180, 255, 0.3);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      z-index: 12;
      backdrop-filter: blur(6px);
    }
    #viewToggle:hover {
      background: rgba(63, 140, 200, 0.35);
      color: #dff1ff;
    }

    /* China 模式：隐藏地球相关 UI（中国地图自身的 .china-gui 面板由 JS 控制显示） */
    body.china-mode .lil-gui:not(.china-gui):not(.china-gui .lil-gui),
    body.china-mode #flightPanel,
    body.china-mode #hud,
    body.china-mode #status {
      display: none;
    }

    /* 中国地图工具提示 */
    #chinaTooltip {
      position: fixed;
      z-index: 40;
      pointer-events: none;
      background: rgba(6, 16, 30, 0.92);
      border: 1px solid rgba(120, 180, 255, 0.4);
      color: #dff1ff;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 13px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }

    /* 中国地图标题 + 返回 */
    #chinaHeader {
      position: fixed;
      left: 18px;
      top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(6, 16, 30, 0.6);
      border: 1px solid rgba(120, 180, 255, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      z-index: 12;
      backdrop-filter: blur(6px);
    }
    #chinaTitle {
      color: #bfe0ff;
      font-size: 14px;
      font-weight: 600;
    }
    #chinaBack {
      background: none;
      border: 1px solid rgba(120, 180, 255, 0.3);
      color: #9fc3e8;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    #chinaBack:hover {
      background: rgba(63, 140, 200, 0.35);
      color: #dff1ff;
    }

    /* China 模式加载提示 */
    #chinaLoading {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #9fc3e8;
      font-size: 15px;
      z-index: 40;
    }

    /* 下钻失败 / 无数据提示 */
    .chinaToast {
      position: fixed;
      left: 50%;
      top: 24px;
      transform: translateX(-50%);
      background: rgba(6, 16, 30, 0.94);
      color: #dff1ff;
      border: 1px solid rgba(255, 180, 120, 0.4);
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 50;
      opacity: 1;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .chinaToast.hide {
      opacity: 0;
      transform: translateX(-50%) translateY(-10px);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "lil-gui": "https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.js"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- 加载层 -->
  <div id="loader">
    <div class="ring"></div>
    <div class="label"><span data-i18n="loader.text">正在加载地球纹理</span> <b id="progress">0%</b></div>
  </div>

  <!-- 操作提示 -->
  <div id="toast"></div>

  <!-- 语言切换 -->
  <div id="langBar">
    <span class="navicon">🌐</span>
    <select id="langSelect" data-i18n-title="lang.placeholder"></select>
    <button id="langRefresh" data-i18n-title="lang.refreshTitle" title="刷新语言列表">⟳</button>
  </div>

  <!-- 视图切换（地球 / 中国地图） -->
  <button id="viewToggle">🗺️ 中国地图</button>

  <!-- 状态信息 -->
  <div id="status">
    <span data-i18n="status.sourcePrefix">地图来源：</span><b>NASA Blue Marble</b><span data-i18n="status.sourceSuffix"> · 贴图：8K</span><br />
    <span class="dim" data-i18n="status.features">昼夜交替 &nbsp;·&nbsp; 云层 &nbsp;·&nbsp; 大气辉光 &nbsp;·&nbsp; 星空闪烁 &nbsp;·&nbsp; 护罩·能量波</span>
  </div>

  <!-- 操作说明 -->
  <div id="hud">
    <h1 data-i18n="hud.title">🌍 三维真实地球</h1>
    <div><span class="k" data-i18n="hud.drag">拖动</span><span data-i18n="hud.dragDesc">：旋转视角</span></div>
    <div><span class="k" data-i18n="hud.scroll">滚轮</span><span data-i18n="hud.scrollDesc">：缩放</span></div>
    <div><span class="k" data-i18n="hud.pan">右键拖动</span><span data-i18n="hud.panDesc">：平移</span></div>
    <div style="margin-top:6px;opacity:.75" data-i18n="hud.note">
      已移除太阳与月球，仅保留昼夜光照。
    </div>
  </div>

  <!-- 飞线设置表格 -->
  <div id="flightPanel">
    <header>
      <span class="title" data-i18n="flight.title">✈️ 飞线设置</span>
      <button id="flightPanelToggle" data-i18n-title="flight.collapseTitle" title="收起/展开" data-i18n="flight.collapse">收起</button>
    </header>
    <div class="body">
      <table>
        <thead>
          <tr><th data-i18n="flight.colSource">起点城市</th><th data-i18n="flight.colTarget">终点城市</th><th data-i18n="flight.colAction">操作</th></tr>
        </thead>
        <tbody id="flightTbody"></tbody>
      </table>
      <button id="flightAddGroup" class="addgroup" data-i18n="flight.addGroup">＋ 新增分组（1 起点 + n 终点）</button>
    </div>
    <div class="foot" data-i18n="flight.foot">
      同一行：起点=该组开头城市，终点=该组一个终点。点「＋」复制本行起点以增加同一组的终点；「－」删除本行。
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
